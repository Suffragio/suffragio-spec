[package]
name = "suffragio-poc"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cbor4ii = { version = "1", features = ["serde1", "use_std"] }
sha2 = "0.10"
rsa = "0.9"
num-bigint-dig = "0.8"
num-integer = "0.1"
rand = "0.8"
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
thiserror = "1"
async-trait = "0.1"

[build-dependencies]
tonic-build = "0.12"
