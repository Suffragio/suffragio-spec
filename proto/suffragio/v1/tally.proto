syntax = "proto3";

package suffragio.v1;

import "google/protobuf/timestamp.proto";
import "suffragio/v1/common.proto";

option go_package = "github.com/suffragio/suffragio-spec/gen/go/suffragio/v1;suffragiov1";

// TallyEngine runs the election-pinned Lua script and publishes the official
// signed results package. Official close time = authorized CloseVotingWindow,
// not peer NTP. See protocol-v1.md.
service TallyEngine {
  rpc CloseVotingWindow(CloseVotingWindowRequest) returns (CloseVotingWindowResponse);
  rpc ComputeResults(ComputeResultsRequest) returns (ComputeResultsResponse);
  rpc PublishResults(PublishResultsRequest) returns (PublishResultsResponse);

  rpc GetResults(GetResultsRequest) returns (GetResultsResponse);
  rpc GetOfficialResultsPackage(GetOfficialResultsPackageRequest) returns (GetOfficialResultsPackageResponse);
  rpc GetTallySnapshot(GetTallySnapshotRequest) returns (GetTallySnapshotResponse);

  rpc WatchEvents(WatchEventsRequest) returns (stream TallyEvent);
}

message CloseVotingWindowRequest {
  ElectionId election_id = 1;
  // Detached signatures from commission keys authorizing close (m-of-n policy).
  repeated bytes authorizing_signatures = 2;
}
message CloseVotingWindowResponse {}

message ComputeResultsRequest {
  ElectionId election_id = 1;
  // Log head the computation is based on (must match package later).
  bytes log_head_hash = 2;
}
message ComputeResultsResponse {
  ElectionResults results = 1;
}

message PublishResultsRequest {
  ElectionId election_id = 1;
  OfficialResultsPackage package = 2;
}
message PublishResultsResponse {}

message ConstituencyResult {
  ConstituencyId constituency_id = 1;
  // Keys = stable DSL ids only.
  map<string, int64> tally_by_choice = 2;
}

message ElectionResults {
  ElectionId election_id = 1;
  repeated ConstituencyResult constituency_results = 2;
  uint64 total_votes_counted = 3;
  uint64 invalid_rejected_at_submit = 4;
  google.protobuf.Timestamp computed_at = 5;
  bytes formula_content_hash = 6;
  bytes log_head_hash = 7;
}

// Normative official package: results + log commitment + script hash + m-of-n sigs.
message OfficialResultsPackage {
  ElectionResults results = 1;
  bytes log_head_hash = 2;
  bytes formula_content_hash = 3;
  string formula_catalog_script_id = 4;
  // Canonical serialization of the signed payload is implementation-defined
  // but MUST be documented; signatures cover that payload.
  repeated CommissionSignature signatures = 5;
}

message CommissionSignature {
  string key_id = 1;
  bytes signature = 2;
  google.protobuf.Timestamp signed_at = 3;
}

message GetResultsRequest {
  ElectionId election_id = 1;
}
message GetResultsResponse {
  ElectionResults results = 1;
  bool published = 2;
}

message GetOfficialResultsPackageRequest {
  ElectionId election_id = 1;
}
message GetOfficialResultsPackageResponse {
  OfficialResultsPackage package = 1;
}

message GetTallySnapshotRequest {
  ElectionId election_id = 1;
}
message GetTallySnapshotResponse {
  EventCursor cursor = 1;
  bool closed = 2;
  bool published = 3;
  bytes log_head_hash = 4;
  google.protobuf.Timestamp captured_at = 5;
}

message VotingWindowClosed {
  ElectionId election_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  bytes log_head_hash_hint = 3;
}

message ResultsPublished {
  ElectionId election_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  bytes results_payload_hash = 3;
  bytes log_head_hash = 4;
  bytes formula_content_hash = 5;
}

message TallyEvent {
  EventCursor cursor = 1;
  oneof event {
    VotingWindowClosed voting_window_closed = 2;
    ResultsPublished results_published = 3;
  }
}
