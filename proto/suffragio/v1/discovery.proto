syntax = "proto3";

package suffragio.v1;

import "google/protobuf/timestamp.proto";
import "suffragio/v1/common.proto";

option go_package = "github.com/suffragio/suffragio-spec/gen/go/suffragio/v1;suffragiov1";

// Discovery backs the public Election Catalog: node announcement on the
// P2P overlay, and the browsable directory of upcoming/ongoing/past
// elections built by indexing ElectionRegistryEvent.election_published and
// election_scheduled. See /architecture/#system-components.
//
// Suffragio is not a single global network: like BitTorrent swarms
// coordinated by different trackers, different organizers may run their
// election(s) on physically separate P2P networks, each coordinated by its
// own tracker node. Every response from this service therefore identifies
// the tracker (by its I2P domain) that produced it, or that a given
// election lives behind, so a client knows which network to join next.
service Discovery {
  // --- Commands ---
  rpc AnnounceNode(AnnounceNodeRequest) returns (AnnounceNodeResponse);

  // --- Queries ---
  rpc DiscoverElections(DiscoverElectionsRequest) returns (DiscoverElectionsResponse);

  // --- Events ---
  rpc WatchEvents(WatchEventsRequest) returns (stream DiscoveryEvent);
}

// Identifies the tracker network a node, election, or response belongs
// to. Two clients pointed at different trackers are, for all practical
// purposes, on different Suffragio networks and will not see each
// other's nodes or elections unless a tracker explicitly federates with
// another (out of scope for this protocol version).
message TrackerRef {
  // .b32.i2p domain of the tracker coordinating this network.
  string i2p_domain = 1;
}

// --- Commands ---

enum NodeRole {
  NODE_ROLE_UNSPECIFIED = 0;
  NODE_ROLE_ELECTION_REGISTRY = 1;
  NODE_ROLE_REGISTRATION_ELIGIBILITY = 2;
  NODE_ROLE_BLIND_SIGNATURE_AUTHORITY = 3;
  NODE_ROLE_VOTE_BROADCAST_QUEUE = 4;
  NODE_ROLE_TALLY_ENGINE = 5;
  NODE_ROLE_CATALOG_MIRROR = 6;
}

message NodeInfo {
  string node_id = 1;
  repeated NodeRole roles = 2;
  // .b32.i2p destination, if this node is reachable over I2P.
  string i2p_address = 3;
  // USK/CHK root key, if this node mirrors data to Freenet/Hyphanet.
  string freenet_key = 4;
  // Tracker network this node announced itself on.
  TrackerRef tracker = 5;
}

message AnnounceNodeRequest {
  NodeInfo node = 1;
}
message AnnounceNodeResponse {
  // The tracker that accepted the announcement, confirming which network
  // the node is now part of.
  TrackerRef tracker = 1;
}

// --- Queries ---

message ElectionSummary {
  ElectionId election_id = 1;
  string title = 2;
  repeated Constituency constituencies = 3;
  VotingWindow voting_window = 4;
  bool published = 5;
  // Tracker network this election's services (Election Registry,
  // Registration & Eligibility, BSA, Vote Broadcast Queue, ...) run on.
  // Different elections discovered in the same DiscoverElections response
  // may point to different trackers.
  TrackerRef tracker = 6;
}

message DiscoverElectionsRequest {
  // Free-text filter over title/organizer. Empty = all published elections.
  string query = 1;
  int32 page_size = 2;
  string page_token = 3;
  // Optional: restrict results to elections on this tracker network only.
  // Empty = query the tracker this request was sent to (and any networks
  // it federates with, if applicable).
  TrackerRef tracker = 4;
}
message DiscoverElectionsResponse {
  repeated ElectionSummary elections = 1;
  string next_page_token = 2;
  // The tracker that answered this query.
  TrackerRef tracker = 3;
}

// --- Events ---

message WatchEventsRequest {}

message NodeAnnounced {
  NodeInfo node = 1;
  google.protobuf.Timestamp occurred_at = 2;
  // The tracker network the announcement was observed on.
  TrackerRef tracker = 3;
}

message DiscoveryEvent {
  oneof event {
    NodeAnnounced node_announced = 1;
  }
}
