syntax = "proto3";

package suffragio.v1;

import "google/protobuf/timestamp.proto";
import "suffragio/v1/common.proto";

option go_package = "github.com/suffragio/suffragio-spec/gen/go/suffragio/v1;suffragiov1";

// RegistrationEligibility validates identity, maintains rolls, issues and
// atomically consumes EligibilityTokens. See protocol-v1.md.
service RegistrationEligibility {
  rpc RegisterVoterRoll(RegisterVoterRollRequest) returns (RegisterVoterRollResponse);
  rpc VerifyIdentity(VerifyIdentityRequest) returns (VerifyIdentityResponse);
  rpc RevokeVotingRights(RevokeVotingRightsRequest) returns (RevokeVotingRightsResponse);
  // BSA-only (AuthZ). Atomic single-use consume. Response MUST NOT include voter_id.
  rpc ConsumeEligibilityToken(ConsumeEligibilityTokenRequest) returns (ConsumeEligibilityTokenResponse);

  rpc GetVoterStatus(GetVoterStatusRequest) returns (GetVoterStatusResponse);
  rpc GetRegistrationSnapshot(GetRegistrationSnapshotRequest) returns (GetRegistrationSnapshotResponse);

  rpc WatchEvents(WatchEventsRequest) returns (stream RegistrationEligibilityEvent);
}

message VoterEntry {
  // Opaque per-election stable id (never raw PESEL). Different across elections
  // for external observers. See protocol-v1.md § voter_id.
  string voter_id = 1;
  ConstituencyId constituency_id = 2;
}

message RegisterVoterRollRequest {
  ElectionId election_id = 1;
  repeated VoterEntry voters = 2;
}
message RegisterVoterRollResponse {
  int32 registered_count = 1;
}

// Client-held assertion (JWT, e-signature container, ...).
message IdentityProof {
  // Adapter id, e.g. "gov-registry", "mobywatel-eidas", "ldap", "oidc".
  string adapter = 1;
  bytes assertion = 2;
}

message VerifyIdentityRequest {
  ElectionId election_id = 1;
  // Exactly one of proof or auth_session_ref SHOULD be set (adapter-dependent).
  IdentityProof proof = 2;
  // Server-side flow handle (OIDC redirect, mObywatel broker, in-person session).
  string auth_session_ref = 3;
}
message VerifyIdentityResponse {
  EligibilityToken token = 1;
  ConstituencyId constituency_id = 2;
  google.protobuf.Timestamp expires_at = 3;
}

// Removes from roll / blocks new tokens. Does not affect ballots already
// signed or cast. See protocol-v1.md § Revoke.
message RevokeVotingRightsRequest {
  ElectionId election_id = 1;
  string voter_id = 2;
  string reason = 3;
}
message RevokeVotingRightsResponse {}

message ConsumeEligibilityTokenRequest {
  ElectionId election_id = 1;
  EligibilityToken token = 2;
}
message ConsumeEligibilityTokenResponse {
  ConstituencyId constituency_id = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message GetVoterStatusRequest {
  ElectionId election_id = 1;
  string voter_id = 2;
}
message GetVoterStatusResponse {
  bool registered = 1;
  bool eligible = 2;
  bool revoked = 3;
  ConstituencyId constituency_id = 4;
}

message GetRegistrationSnapshotRequest {
  ElectionId election_id = 1;
}
message GetRegistrationSnapshotResponse {
  EventCursor cursor = 1;
  google.protobuf.Timestamp captured_at = 2;
  // Aggregate counts only — not a dump of voter_ids (privacy).
  int32 registered_count = 3;
  int32 revoked_count = 4;
  int32 tokens_issued_count = 5;
  int32 tokens_consumed_count = 6;
}

message VoterRegistered {
  ElectionId election_id = 1;
  ConstituencyId constituency_id = 2;
  int32 count = 3;
  google.protobuf.Timestamp occurred_at = 4;
}

// No voter_id — must not correlate verification with casting.
message VoterEligibilityVerified {
  ElectionId election_id = 1;
  ConstituencyId constituency_id = 2;
  google.protobuf.Timestamp occurred_at = 3;
}

message VoterRightsRevoked {
  ElectionId election_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
}

message EligibilityTokenConsumed {
  ElectionId election_id = 1;
  ConstituencyId constituency_id = 2;
  google.protobuf.Timestamp occurred_at = 3;
}

message RegistrationEligibilityEvent {
  EventCursor cursor = 1;
  oneof event {
    VoterRegistered voter_registered = 2;
    VoterEligibilityVerified voter_eligibility_verified = 3;
    VoterRightsRevoked voter_rights_revoked = 4;
    EligibilityTokenConsumed eligibility_token_consumed = 5;
  }
}
