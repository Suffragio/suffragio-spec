syntax = "proto3";

package suffragio.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/suffragio/suffragio-spec/gen/go/suffragio/v1;suffragiov1";

// Types shared across all Suffragio services. Normative behaviour: see
// docs Protocol v1 (protocol-v1.md).

message ElectionId {
  string value = 1;
}

message ConstituencyId {
  string value = 1;
}

// Opaque random single-use token. Semantics live in Registration &
// Eligibility server state; consumed via ConsumeEligibilityToken.
message EligibilityToken {
  string value = 1;
}

// Versioned crypto suite identifiers (string, not enum, so new suites
// can be added without breaking protobuf enums). Default v1 blind-sig:
// "BLIND_SIG_RSA_FDH_3072_SHA256".
message CryptoSuiteId {
  string value = 1;
}

message Constituency {
  ConstituencyId id = 1;
  string name = 2;
}

message VotingWindow {
  google.protobuf.Timestamp starts_at = 1;
  google.protobuf.Timestamp ends_at = 2;
}

// BSA verification key published with the election.
message BsaPublicKey {
  string key_id = 1;
  CryptoSuiteId suite_id = 2;
  bytes public_key = 3;
  google.protobuf.Timestamp not_before = 4;
  google.protobuf.Timestamp not_after = 5;
}

// Ballot template: Suffragio ballot DSL (JSON), not raw JSON Schema.
// See protocol-v1.md § Ballots.
message BallotTemplate {
  ConstituencyId constituency_id = 1;
  // e.g. "suffragio-ballot-dsl/1"
  string dsl_version = 2;
  // DSL document as UTF-8 JSON (stable question/option ids required).
  string document_json = 3;
}

// How the tally Lua script is attached to an election.
message FormulaScriptRef {
  // SHA-256 (or election-pinned hash suite) of the exact script bytes.
  // Authoritative: if catalog bytes disagree, hash wins / reject.
  bytes content_hash = 1;
  // Inline script bytes (mutually exclusive with catalog_script_id in practice).
  bytes inline_script = 2;
  // FormulaCatalog script id when not inline.
  string catalog_script_id = 3;
}

// Normative election lifecycle. See protocol-v1.md § Election state machine.
enum ElectionState {
  ELECTION_STATE_UNSPECIFIED = 0;
  ELECTION_STATE_DRAFT = 1;
  ELECTION_STATE_READY = 2;
  ELECTION_STATE_PUBLISHED = 3;
  ELECTION_STATE_VOTING = 4;
  ELECTION_STATE_CLOSED = 5;
  ELECTION_STATE_TALLIED = 6;
  ELECTION_STATE_RESULTS_PUBLISHED = 7;
}

// Resume token for WatchEvents streams.
message EventCursor {
  string value = 1;
}

// Shared empty-ish watch filter.
message WatchEventsRequest {
  ElectionId election_id = 1;
  EventCursor after_cursor = 2;
}

// Generic content-addressed snapshot handle.
message SnapshotId {
  string value = 1;
}
