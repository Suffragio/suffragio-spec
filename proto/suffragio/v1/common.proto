syntax = "proto3";

package suffragio.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/suffragio/suffragio-spec/gen/go/suffragio/v1;suffragiov1";

// Types shared across all Suffragio services. Every service-specific
// .proto file in this package imports this file instead of redefining
// these identifiers, so they stay consistent across the whole system.

// Globally unique identifier for an election.
message ElectionId {
  string value = 1;
}

// Identifier of an electoral constituency within an election.
message ConstituencyId {
  string value = 1;
}

// A single-use token proving a voter's eligibility for a specific
// election/constituency, issued by the Registration & Eligibility
// Service and consumed by the Blind Signature Authority.
message EligibilityToken {
  string value = 1;
}

// Electoral formulas supported by the Tally Engine. Extend this enum
// (never reuse or renumber existing values) as new formulas are added.
enum ElectoralFormula {
  ELECTORAL_FORMULA_UNSPECIFIED = 0;
  ELECTORAL_FORMULA_FIRST_PAST_THE_POST = 1;
  ELECTORAL_FORMULA_DHONDT = 2;
  ELECTORAL_FORMULA_SINGLE_TRANSFERABLE_VOTE = 3;
}

message Constituency {
  ConstituencyId id = 1;
  string name = 2;
}

// Voting window during which SubmitVote is accepted for an election.
message VotingWindow {
  google.protobuf.Timestamp starts_at = 1;
  google.protobuf.Timestamp ends_at = 2;
}

// A ballot template attached to a constituency. `schema_json` is a JSON
// Schema document describing question types, choices, and layout, so the
// Voter Client can render and validate an arbitrary ballot shape (yes/no,
// single/multiple choice, ranked, party lists, etc.) without the protocol
// itself needing to know about it.
message BallotTemplate {
  ConstituencyId constituency_id = 1;
  string schema_json = 2;
}
