syntax = "proto3";

package suffragio.v1;

import "google/protobuf/timestamp.proto";
import "suffragio/v1/common.proto";

option go_package = "github.com/suffragio/suffragio-spec/gen/go/suffragio/v1;suffragiov1";

// BlindSignatureAuthority consumes an EligibilityToken and issues a blind
// signature over a ballot it cannot read, guaranteeing that the act of
// *authorizing* a ballot is never linkable to the act of *casting* it.
// See /architecture/#blind-signature-ballot-issuance.
service BlindSignatureAuthority {
  // --- Commands ---
  rpc RequestBlindSignature(RequestBlindSignatureRequest) returns (RequestBlindSignatureResponse);

  // --- Events ---
  rpc WatchEvents(WatchEventsRequest) returns (stream BlindSignatureEvent);
}

// --- Commands ---

message RequestBlindSignatureRequest {
  ElectionId election_id = 1;
  EligibilityToken token = 2;
  // Blinded representation of the blank ballot (e.g. RSA or BLS blind
  // signature scheme). The authority never sees the unblinded value.
  bytes blinded_ballot = 3;
}
message RequestBlindSignatureResponse {
  bytes blind_signature = 1;
}

// --- Events ---

message WatchEventsRequest {
  ElectionId election_id = 1;
}

// Proves that one more signature was issued for this election, without
// revealing the token, the blinded value, or any link to a later vote.
message BlindSignatureIssued {
  ElectionId election_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
}

message BlindSignatureEvent {
  oneof event {
    BlindSignatureIssued blind_signature_issued = 1;
  }
}
