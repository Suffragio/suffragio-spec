syntax = "proto3";

package suffragio.v1;

import "google/protobuf/timestamp.proto";
import "suffragio/v1/common.proto";

option go_package = "github.com/suffragio/suffragio-spec/gen/go/suffragio/v1;suffragiov1";

// BlindSignatureAuthority issues blind signatures over full filled ballots.
// For public elections, RequestBlindSignature MUST be reached via Freenet.
// BSA calls RegistrationEligibility.ConsumeEligibilityToken (no voter_id).
// See protocol-v1.md.
service BlindSignatureAuthority {
  rpc RequestBlindSignature(RequestBlindSignatureRequest) returns (RequestBlindSignatureResponse);

  rpc GetBlindSignatureSnapshot(GetBlindSignatureSnapshotRequest) returns (GetBlindSignatureSnapshotResponse);
  rpc WatchEvents(WatchEventsRequest) returns (stream BlindSignatureEvent);
}

message RequestBlindSignatureRequest {
  ElectionId election_id = 1;
  EligibilityToken token = 2;
  // Blinded encoding of the deterministic CBOR filled ballot (suite-specific).
  bytes blinded_ballot = 3;
  // Which published BSA key will correspond after unblinding.
  string key_id = 4;
  CryptoSuiteId suite_id = 5;
}
message RequestBlindSignatureResponse {
  bytes blind_signature = 1;
  string key_id = 2;
}

message GetBlindSignatureSnapshotRequest {
  ElectionId election_id = 1;
}
message GetBlindSignatureSnapshotResponse {
  EventCursor cursor = 1;
  google.protobuf.Timestamp captured_at = 2;
  uint64 signatures_issued_count = 3;
}

message BlindSignatureIssued {
  ElectionId election_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  // No token, ballot, signature, or voter identity.
}

message BlindSignatureEvent {
  EventCursor cursor = 1;
  oneof event {
    BlindSignatureIssued blind_signature_issued = 2;
  }
}
